name: Run Jio Gemini OTP

on:
  workflow_dispatch: # يتيح تشغيل السكريبت يدوياً من تبويب Actions

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run script
        env:
          GRIZZLY_API_KEY: ${{ secrets.GRIZZLY_API_KEY }}
        run: |
          python jio.py
