name: Run Jio Gemini OTP Headless

on:
  workflow_dispatch: # يسمح بتشغيله يدوياً من تبويب Actions مع إمكانية اختيار الوضع
    inputs:
      mode:
        description: 'Execution Mode (1 or 2)'
        required: true
        default: '2'

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Python Script in Headless Mode
        env:
          GRIZZLY_API_KEY: ${{ secrets.GRIZZLY_API_KEY }}
          JIO_MODE: ${{ github.event.inputs.mode || '2' }}
          JIO_SERVICE_CODE: 'jio'
          JIO_COUNTRY_CODE: '22'
          JIO_MAX_PRICE: '0.208'
          JIO_MAX_NUMBERS: '5'
          JIO_WAIT_MINS: '30'
          JIO_INTERVAL: '15'
        run: |
          python jio.py

      - name: Upload activation link file locally/remotely
        uses: actions/upload-artifact@v4
        with:
          name: gemini-activation-link
          path: gemini_activation_link.txt
